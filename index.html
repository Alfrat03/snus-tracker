<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Snus Tracker</title>
<meta name="description" content="Tieni il conto di bustine, nicotina e spesa.">
<meta name="theme-color" content="#f2f2f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Snus Tracker">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
/* Snus Tracker — prototipo in stile iOS con Liquid Glass.
   Il vetro (sfocatura + riflesso) è riservato a controlli e navigazione; i contenuti stanno su superfici piene, come nelle app di sistema. */
:root{
  --bg:#f2f2f7;--surface:#ffffff;--ink:#000000;--ink-muted:#66666d;--sep:rgba(60,60,67,.16);--fill:rgba(120,120,128,.16);
  --tint:#007aff;--tint-text:#0062cc;--tint-soft:rgba(0,122,255,.12);
  --c-wait:#007aff;--c-active:#d35f00;--c-ready:#34c759;--on-ready:#0a2a12;
  --alert:#d70015;--alert-soft:rgba(215,0,21,.10);
  --data:#007aff;--scrim:rgba(0,0,0,.28);
  --glass-a:rgba(255,255,255,.80);--glass-b:rgba(255,255,255,.52);
  --glass-edge:inset 0 0 0 .5px rgba(255,255,255,.7),inset 0 1px 0 rgba(255,255,255,.95);
  --glass-shadow:0 0 0 .5px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.10);
  --glass-strong-a:rgba(255,255,255,.86);--glass-strong-b:rgba(255,255,255,.70);
  --lens:rgba(120,120,128,.18);
  --stage:#dfe2e8;--bezel:#0b0b0e;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;
  --touch-min:44px;--control-height:50px;
  --font-sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Helvetica Neue",Arial,sans-serif;
  --status:54px;--tab-bottom:26px;--tabspace:112px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000;--surface:#1c1c1e;--ink:#ffffff;--ink-muted:#a1a1a8;--sep:rgba(84,84,88,.6);--fill:rgba(120,120,128,.32);
    --tint:#0a84ff;--tint-text:#409cff;--tint-soft:rgba(10,132,255,.22);
    --c-wait:#0a84ff;--c-active:#ff9f0a;--c-ready:#30d158;--on-ready:#06210d;
    --alert:#ff6961;--alert-soft:rgba(255,105,97,.16);
    --data:#0a84ff;--scrim:rgba(0,0,0,.5);
    --glass-a:rgba(120,120,128,.40);--glass-b:rgba(70,70,76,.34);
    --glass-edge:inset 0 0 0 .5px rgba(255,255,255,.20),inset 0 1px 0 rgba(255,255,255,.30);
    --glass-shadow:0 0 0 .5px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5);
    --glass-strong-a:rgba(60,60,64,.82);--glass-strong-b:rgba(44,44,48,.74);
    --lens:rgba(255,255,255,.16);
    --stage:#0a0a0d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000;--surface:#1c1c1e;--ink:#ffffff;--ink-muted:#a1a1a8;--sep:rgba(84,84,88,.6);--fill:rgba(120,120,128,.32);
  --tint:#0a84ff;--tint-text:#409cff;--tint-soft:rgba(10,132,255,.22);
  --c-wait:#0a84ff;--c-active:#ff9f0a;--c-ready:#30d158;--on-ready:#06210d;
  --alert:#ff6961;--alert-soft:rgba(255,105,97,.16);
  --data:#0a84ff;--scrim:rgba(0,0,0,.5);
  --glass-a:rgba(120,120,128,.40);--glass-b:rgba(70,70,76,.34);
  --glass-edge:inset 0 0 0 .5px rgba(255,255,255,.20),inset 0 1px 0 rgba(255,255,255,.30);
  --glass-shadow:0 0 0 .5px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5);
  --glass-strong-a:rgba(60,60,64,.82);--glass-strong-b:rgba(44,44,48,.74);
  --lens:rgba(255,255,255,.16);
  --stage:#0a0a0d;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;color:inherit}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
:focus-visible{outline:3px solid var(--tint);outline-offset:2px}
.num,.text-timer,.text-figure{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-muted)}

/* tipografia (stili di testo iOS) */
.large-title{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.37px}
.unit{font-size:.55em;font-weight:600;color:var(--ink-muted);letter-spacing:0}
.ds-tile .text-title{white-space:nowrap}
.text-title{font-size:28px;line-height:34px;font-weight:700;letter-spacing:.36px}
.text-heading{font-size:20px;line-height:25px;font-weight:600;letter-spacing:.38px}
.text-body{font-size:17px;line-height:22px;font-weight:400;letter-spacing:-.4px}
.text-body-strong{font-size:17px;line-height:22px;font-weight:600;letter-spacing:-.4px}
.text-button{font-size:17px;line-height:22px;font-weight:600;letter-spacing:-.4px}
.text-detail{font-size:15px;line-height:20px;font-weight:400;letter-spacing:-.24px}
.text-label{font-size:13px;line-height:18px;font-weight:400;letter-spacing:-.08px}
.text-timer{font-size:64px;line-height:68px;font-weight:300;letter-spacing:-1px}
.ds-icon{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* vetro: sfocatura dello sfondo, riflesso sul bordo e ombra morbida */
.ds-button--secondary,.ds-button--danger,.ds-tabbar,.ds-stepper button,.toast,.ds-notif,.ds-sheet{
  background:linear-gradient(180deg,var(--glass-a),var(--glass-b));
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  box-shadow:var(--glass-edge),var(--glass-shadow);
}

/* scena e cornice */
.stage{height:100%;display:flex;align-items:center;justify-content:center;gap:48px;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.fit{width:calc(410px * var(--fit,1));height:calc(864px * var(--fit,1));flex:none}
.device{position:relative;width:410px;height:864px;border:10px solid var(--bezel);border-radius:62px;background:var(--bezel);transform:scale(var(--fit,1));transform-origin:top left;box-shadow:0 0 0 2px rgba(120,120,128,.4),0 24px 60px rgba(0,0,0,.25)}
.island{position:absolute;top:11px;left:50%;width:120px;height:34px;margin-left:-60px;border-radius:999px;background:var(--bezel);z-index:8}
.screen{position:relative;width:100%;height:100%;border-radius:52px;overflow:hidden;background:var(--bg)}
.scene{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.scene svg{display:block;width:100%;height:100%}
:root[data-theme="dark"] .scene svg{filter:brightness(.62) saturate(.9)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .scene svg{filter:brightness(.62) saturate(.9)}}
#screen[data-scene="0"] .scene{display:none}
#screen[data-scene="1"]{background:linear-gradient(180deg,var(--s-bg),var(--s-bg2))}
#screen[data-scene="1"] .tabfade{display:none}
#screen{--s-bg:var(--sl-bg);--s-bg2:var(--sl-bg2);--s-lid:var(--sl-lid);--s-lidhi:var(--sl-lidhi);--s-wall:var(--sl-wall);--s-wallhi:var(--sl-wallhi);--s-edge:var(--sl-edge);--s-ink:var(--sl-ink);--s-pouch:var(--sl-pouch);--s-pouchlo:var(--sl-pouchlo);--s-shadow:var(--sl-shadow);--s-fx1:var(--sl-fx1);--s-fx2:var(--sl-fx2);--s-fx3:var(--sl-fx3);--s-fx4:var(--sl-fx4)}
:root[data-theme="dark"] #screen{--s-bg:var(--sd-bg);--s-bg2:var(--sd-bg2);--s-lid:var(--sd-lid);--s-lidhi:var(--sd-lidhi);--s-wall:var(--sd-wall);--s-wallhi:var(--sd-wallhi);--s-edge:var(--sd-edge);--s-ink:var(--sd-ink);--s-pouch:var(--sd-pouch);--s-pouchlo:var(--sd-pouchlo);--s-shadow:var(--sd-shadow);--s-fx1:var(--sd-fx1);--s-fx2:var(--sd-fx2);--s-fx3:var(--sd-fx3);--s-fx4:var(--sd-fx4)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #screen{--s-bg:var(--sd-bg);--s-bg2:var(--sd-bg2);--s-lid:var(--sd-lid);--s-lidhi:var(--sd-lidhi);--s-wall:var(--sd-wall);--s-wallhi:var(--sd-wallhi);--s-edge:var(--sd-edge);--s-ink:var(--sd-ink);--s-pouch:var(--sd-pouch);--s-pouchlo:var(--sd-pouchlo);--s-shadow:var(--sd-shadow);--s-fx1:var(--sd-fx1);--s-fx2:var(--sd-fx2);--s-fx3:var(--sd-fx3);--s-fx4:var(--sd-fx4)}}
#screen[data-scene="1"] .oggi__count--pack{text-shadow:0 0 10px var(--s-bg),0 0 3px var(--s-bg)}
/* barra delle schede sopra lo sfondo illustrato: vetro più pieno e etichette scure */
#screen[data-scene="1"] .ds-tabbar{background:linear-gradient(180deg,var(--glass-strong-a),var(--glass-strong-b));-webkit-backdrop-filter:blur(30px) saturate(160%);backdrop-filter:blur(30px) saturate(160%)}
#screen[data-scene="1"] .ds-tab:not([aria-current="page"]){color:var(--ink);font-weight:600}
.status{position:absolute;top:0;left:0;right:0;height:var(--status);z-index:3;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 10px 38px;color:var(--ink);pointer-events:none}
.status::before{content:"";position:absolute;inset:0 0 -14px 0;z-index:-1;background:linear-gradient(var(--bg),color-mix(in srgb,var(--bg) 70%,transparent) 65%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.status__icons{display:flex;gap:6px;align-items:center}
.status__icons svg{height:13px;width:auto;fill:currentColor}
.view{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding-top:var(--status);padding-bottom:var(--tabspace)}
.view::-webkit-scrollbar{display:none}
.home-ind{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:999px;background:var(--ink);opacity:.85;z-index:7;pointer-events:none}

/* pannello del prototipo (solo schermi larghi) */
.panel{width:300px;display:flex;flex-direction:column;gap:var(--space-5);color:var(--ink)}
.panel h2{font-size:20px;line-height:25px;font-weight:600}
.panel__group{display:flex;flex-direction:column;gap:var(--space-2)}
.panel__jumps{display:flex;gap:var(--space-2);flex-wrap:wrap}
.panel .ds-button{min-height:var(--touch-min);padding:0 var(--space-4)}

/* oggi */
.oggi{display:flex;flex-direction:column;min-height:100%;padding:var(--space-1) 20px var(--space-3);gap:var(--space-5)}
.oggi__pouch{display:flex;justify-content:center;align-items:center;flex:1;margin-top:0}
.packcan{position:relative;display:block;width:min(100%,288px);aspect-ratio:1;padding:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;color:var(--ink)}
.packcan svg{display:block;width:100%;height:100%;overflow:visible;transition:transform .18s ease}
.packcan:active svg{transform:scale(.97)}
.packcan:focus-visible{outline:3px solid var(--accent,#0a84ff);outline-offset:6px;border-radius:24px}
.packcan.is-new{animation:pk .5s ease-out}
.packcan__chev-unused{position:absolute;right:10px;bottom:14px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--surface) 78%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 2px 10px rgba(0,0,0,.18),inset 0 0 0 .5px rgba(255,255,255,.6);color:var(--ink)}
.packcan__chev .ds-icon{width:18px;height:18px;transform:rotate(90deg)}
.oggi__info{display:flex;flex-direction:column;align-items:center;gap:0;text-align:center}
.oggi__actions{display:flex;flex-direction:column;align-items:center;gap:var(--space-3);margin-top:auto}
.oggi__actions .ds-button--block{width:100%}
.page__head .large-title{flex:none}
.oggi__count{display:inline-flex;align-items:center;gap:var(--space-1);min-height:var(--touch-min);padding:0 var(--space-3);border:0;border-radius:999px;background:transparent;color:var(--ink-muted);cursor:pointer;-webkit-tap-highlight-color:transparent}
.oggi__count:active{background:var(--fill)}
.mini{position:relative;flex:none;width:52px;height:52px;display:grid;place-items:center;padding:0;border:0;border-radius:50%;background:transparent;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
.mini svg{position:absolute;inset:0;width:100%;height:100%}
.mini__track{fill:none;stroke:var(--fill);stroke-width:4}
.mini__arc{fill:none;stroke:var(--ink-muted);stroke-width:4;stroke-linecap:round}
.mini__n{position:relative;font-size:13px;line-height:16px;font-weight:600;letter-spacing:-.2px}
.mini__n--s{font-size:11px;letter-spacing:-.3px}
.mini:active{background:var(--fill)}
.oggi__count--pack{color:var(--ink)}
.oggi__count--pack .ds-icon{color:var(--ink-muted)}
.oggi__count--pack.is-new{animation:pk .5s ease-out}
@keyframes pk{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.oggi__count .ds-icon{width:16px;height:16px}
.ds-stock{position:relative}
.ds-stock__main{padding-right:60px}
.ds-stock__more{position:absolute;top:var(--space-2);right:var(--space-2);width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;color:var(--ink-muted);cursor:pointer;-webkit-tap-highlight-color:transparent}
.ds-stock__more:active{background:var(--fill)}
.entries{list-style:none;margin:0 0 var(--space-2);padding:0;background:var(--surface);border-radius:18px;overflow:hidden}
.swipe{position:relative;overflow:hidden;border-top:.5px solid var(--sep)}
.swipe:first-child{border-top:0}
.swipe__row{position:relative;display:flex;align-items:center;gap:var(--space-3);min-height:56px;padding:0 var(--space-4);background:var(--surface);touch-action:pan-y;-webkit-user-select:none;user-select:none}
.swipe.sw .swipe__act,.swipe:focus-within .swipe__act{opacity:1}
.swipe:focus-within .swipe__row{transform:translateX(-88px);transition:transform .22s ease-out}
.swipe__act{opacity:0;position:absolute;top:0;right:0;bottom:0;width:88px;display:grid;place-items:center;border:0;background:#c8102e;color:#fff;cursor:pointer}
.entry__t{width:48px;flex:none;color:var(--ink-muted)}
.entry__n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry__mg{flex:none}
.ds-list{background:var(--surface);border-radius:18px;overflow:hidden;margin-bottom:var(--space-2)}
.ds-list__row{display:flex;align-items:center;gap:var(--space-3);width:100%;min-height:64px;padding:var(--space-2) var(--space-4);border:0;background:transparent;color:var(--ink);text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ds-list__row + .ds-list__row{border-top:.5px solid var(--sep)}
.ds-list__row:active{background:var(--fill)}
.ds-list__text{flex:1;min-width:0;display:flex;flex-direction:column}
.ds-list__side{flex:none;color:var(--ink-muted)}
.ds-list__check{flex:none;width:24px;height:24px;color:var(--tint)}
.ds-list__check .ds-icon{stroke-width:2.6}
.ds-sheet .ds-list,.ds-sheet .entries{margin-left:calc(var(--space-3) * -1);margin-right:calc(var(--space-3) * -1)}
.oggi__count--pack .ds-icon{flex:none}
.ds-sheet__title + .ds-list{margin-top:var(--space-3)}
.ds-list__add{min-height:56px;color:var(--tint-text);justify-content:center}
.ds-sheet__grab{position:relative}
.ds-sheet__grab::before{content:"";position:absolute;inset:-14px -60px}
.ds-sheet__grab,.ds-sheet__title,.addpage__head{touch-action:none}
.addpage__grab{margin:0 auto}
.sheet-close{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;background:transparent}
.sheet-close:focus{position:static;display:block;width:auto;height:auto;margin:var(--space-3) auto 0;padding:0 var(--space-5);min-height:var(--touch-min);clip:auto;overflow:visible;background:var(--fill);border-radius:999px;color:var(--tint-text);cursor:pointer}
.tabfade{position:absolute;left:0;right:0;bottom:0;height:calc(var(--tab-bottom) + 78px);background:linear-gradient(180deg,transparent,var(--bg) 70%);pointer-events:none;z-index:3}
.oggi__note{display:flex;flex-direction:column;align-items:center;gap:var(--space-2);text-align:center;color:var(--ink-muted)}

/* pagine */
.page{display:flex;flex-direction:column;gap:var(--space-4);padding:var(--space-1) 20px var(--space-4)}
.page__head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);min-height:var(--touch-min)}
.page__list{display:flex;flex-direction:column;gap:var(--space-3)}

/* RingTimer */
.ds-ring{position:relative;width:min(100%,288px);aspect-ratio:1;color:var(--ink);--fill:var(--c-active)}
.ds-ring svg{display:block;width:100%;height:100%;overflow:visible}
.ds-ring--wait{--fill:var(--c-wait)}
.ds-ring--active{--fill:var(--c-active)}
.ds-ring--ready{--fill:var(--c-ready)}
.ds-ring__disc{fill:var(--surface);filter:drop-shadow(0 1px 1px rgba(0,0,0,.06)) drop-shadow(0 10px 22px rgba(0,0,0,.12))}
.ds-ring--ready .ds-ring__disc{fill:url(#gReady)}
.ds-ring__shine{fill:url(#gShine);opacity:var(--shine,.3);pointer-events:none}
:root[data-theme="dark"] .ds-ring{--shine:.1}
:root[data-theme="dark"] .ds-ring--wait,:root[data-theme="dark"] .ds-ring--active{--shine:0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ds-ring{--shine:.1}:root:not([data-theme="light"]) .ds-ring--wait,:root:not([data-theme="light"]) .ds-ring--active{--shine:0}}
.ds-ring__track{fill:none;stroke:var(--fill);stroke-opacity:.2;stroke-width:14}
.ds-ring__arc-o{display:none}
.ds-ring__arc{fill:none;stroke:var(--fill);stroke-width:14;stroke-linecap:round}
.ds-ring__content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-1);text-align:center;color:var(--ink)}
.ds-ring__content [data-l]{color:var(--ink-muted)}
.ds-ring--ready .ds-ring__content{color:var(--on-ready)}
.ds-ring--ready .ds-ring__content [data-l]{color:var(--on-ready)}
.ds-ring .text-timer{font-size:56px;line-height:60px}
.ds-ring--ready .text-timer{font-weight:600;letter-spacing:-.5px}

/* capsula vuota (stati vuoti) */
.ds-pouch{--level:0;position:relative;width:120px;aspect-ratio:3 / 2;border-radius:40px;background:linear-gradient(180deg,var(--glass-a),var(--glass-b));box-shadow:var(--glass-edge),var(--glass-shadow);overflow:hidden}
.ds-pouch__seam{position:absolute;top:var(--space-3);bottom:var(--space-3);width:0;border-left:2px dashed var(--sep)}
.ds-pouch__seam--l{left:var(--space-4)}
.ds-pouch__seam--r{right:var(--space-4)}

/* pulsanti: capsule. Primario = vetro colorato, secondario = vetro neutro, annulla = vetro con testo rosso */
.ds-button{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);min-height:var(--control-height);min-width:var(--touch-min);padding:0 var(--space-5);border:0;border-radius:999px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .15s,filter .15s}
.ds-button--primary{color:#fff;background:linear-gradient(180deg,#1a85f0,#0058c0);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.35),inset 0 1px 0 rgba(255,255,255,.55),0 1px 2px rgba(0,60,140,.3),0 8px 20px rgba(0,98,204,.32)}
.ds-button--secondary{color:var(--tint-text)}
.ds-button--danger{color:var(--alert)}
.ds-button--quiet{background:transparent;color:var(--tint-text);padding:0 var(--space-3);min-height:var(--touch-min)}
.ds-button--block{display:flex;width:100%}
.ds-button--pill{min-height:var(--touch-min);padding:0 var(--space-4)}
.ds-button--pill:has(.ds-icon){padding-left:var(--space-3)}
.ds-button--pill .ds-icon{width:20px;height:20px;stroke-width:2.4}
.ds-button:active{transform:scale(.97);filter:brightness(.96)}
.ds-button:disabled{cursor:not-allowed;opacity:.45;transform:none}
.field-row{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3)}

/* barra delle schede: capsula di vetro fluttuante, la scheda attiva ha una "lente" */
.ds-tabbar{position:absolute;left:16px;right:16px;bottom:var(--tab-bottom);z-index:4;display:flex;gap:2px;padding:6px;border-radius:999px}
.ds-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;padding:4px 0;border:0;border-radius:999px;background:transparent;color:var(--ink-muted);cursor:pointer;-webkit-tap-highlight-color:transparent;font-size:11px;line-height:13px;font-weight:500;letter-spacing:.06px}
.ds-tab{position:relative}
.ds-tab__dot{position:absolute;top:7px;left:calc(50% + 10px);width:9px;height:9px;border-radius:50%;background:var(--tint);box-shadow:0 0 0 2px var(--bg)}
.ds-tab[aria-current="page"]{color:var(--tint-text);background:var(--lens);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.35),inset 0 1px 0 rgba(255,255,255,.4)}

/* liste raggruppate */
.ds-ledger,.set-list,.form-group{background:var(--surface);border-radius:22px;overflow:hidden}
.ds-ledger__row{display:grid;grid-template-columns:1fr auto;gap:var(--space-1) var(--space-4);align-items:baseline;padding:var(--space-3) var(--space-4);border-top:.5px solid var(--sep)}
.ds-ledger__row:first-child{border-top:0}
.ds-ledger__value{text-align:right;font-variant-numeric:tabular-nums}
.ds-ledger__note{grid-column:1 / -1;color:var(--ink-muted)}
.ds-ledger__bar{grid-column:1 / -1;height:6px;border-radius:999px;background:var(--fill);overflow:hidden}
.ds-ledger__bar > span{display:block;height:100%;width:calc(var(--share) * 100%);background:var(--tint);border-radius:999px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);padding:var(--space-3) var(--space-4);border-top:.5px solid var(--sep);min-height:var(--control-height)}
.set-row:first-child{border-top:0}
.set-row__text{display:flex;flex-direction:column;gap:2px;min-width:0}
.set-row--stack{flex-direction:column;align-items:stretch}

/* PackRow (scelta della confezione) */
.ds-pack{display:grid;grid-template-columns:1fr auto;gap:var(--space-1) var(--space-4);align-items:center;width:100%;min-height:var(--control-height);padding:var(--space-3) var(--space-4);background:var(--surface);border:0;border-radius:18px;color:var(--ink);text-align:left;cursor:pointer;box-shadow:inset 0 0 0 .5px var(--sep)}
.ds-pack[aria-checked="true"]{box-shadow:inset 0 0 0 2px var(--tint)}
.ds-pack__meta{grid-column:1;color:var(--ink-muted)}
.ds-pack__left{grid-column:2;grid-row:1 / span 2;text-align:right}
.ds-pack__left small{display:block;color:var(--ink-muted)}
.ds-pack__badge{grid-column:1;display:inline-flex;align-items:center;gap:var(--space-1);justify-self:start;padding:0 var(--space-3) 0 var(--space-2);min-height:22px;border-radius:999px;background:var(--tint-soft);color:var(--tint-text);font-weight:600}
.ds-pack__badge .ds-icon{width:14px;height:14px;stroke-width:2.8}

/* StockCard */
.ds-stock{background:var(--surface);border-radius:22px;color:var(--ink);box-shadow:inset 0 0 0 .5px var(--sep)}
.ds-stock[data-use="true"]{box-shadow:inset 0 0 0 2px var(--tint)}
.ds-stock--empty{opacity:.8}
.ds-stock__main{display:grid;gap:var(--space-1);width:100%;padding:var(--space-3) var(--space-4);border:0;background:transparent;color:inherit;text-align:left;cursor:pointer;border-radius:22px 22px 0 0}
.ds-stock__main:disabled{cursor:default}
.ds-stock--empty .ds-stock__main{color:var(--ink-muted)}
.ds-stock__meta{color:var(--ink-muted)}
.ds-stock__adj{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);padding:var(--space-2) var(--space-4) var(--space-3);border-top:.5px solid var(--sep)}

/* PresetCard */
.presets{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2)}
.ds-preset{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0;padding:var(--space-3);background:var(--surface);border:0;border-radius:18px;color:var(--ink);text-align:left;cursor:pointer;box-shadow:inset 0 0 0 .5px var(--sep)}
.ds-preset[aria-checked="true"]{box-shadow:inset 0 0 0 2px var(--tint)}
.ds-preset__tag{color:var(--tint-text);font-weight:600}

/* moduli */
.form-item + .form-item{border-top:.5px solid var(--sep)}
.form-row{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);min-height:var(--control-height);padding:var(--space-2) var(--space-4)}
.form-row > label{flex:none}
.form-row > span{flex:1;min-width:0}
.form-input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;text-align:right;padding:var(--space-2) 0}
.form-input::placeholder{color:var(--ink-muted);opacity:.85}
.form-input:focus{outline:none}
.form-item:focus-within{background:var(--tint-soft)}
.form-foot{color:var(--ink-muted);padding:0 var(--space-4);margin-top:calc(var(--space-2) * -1)}
.ds-field__error{display:flex;align-items:flex-start;gap:var(--space-2);color:var(--alert);padding:0 var(--space-4) var(--space-3)}
.ds-field__error .ds-icon{width:18px;height:18px}
.is-error .form-row > label{color:var(--alert)}
.ds-field{display:flex;flex-direction:column;gap:var(--space-2)}
.form-sec-title{color:var(--ink-muted);padding:0 var(--space-4)}

/* controllo segmentato */
.ds-segmented{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--fill)}
.ds-segmented__opt{flex:1;min-height:34px;padding:0 var(--space-3);border:0;border-radius:999px;background:transparent;color:var(--ink);font:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2)}
.ds-segmented--sm .ds-segmented__opt{min-height:38px}
.ds-segmented__opt[aria-checked="true"]{background:var(--surface);font-weight:600;box-shadow:0 0 0 .5px rgba(0,0,0,.06),0 2px 6px rgba(0,0,0,.14)}
:root[data-theme="dark"] .ds-segmented__opt[aria-checked="true"]{background:#636366}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ds-segmented__opt[aria-checked="true"]{background:#636366}}
.dash-seg{width:176px;flex:none}

/* stepper (− n +) */
.ds-stepper{display:inline-flex;align-items:center;gap:var(--space-2);flex:none}
.ds-stepper button{width:var(--touch-min);height:var(--touch-min);display:grid;place-items:center;border:0;border-radius:50%;color:var(--tint-text);cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
.ds-stepper button:active{transform:scale(.94)}
.ds-stepper button:disabled{opacity:.4;cursor:not-allowed}
.ds-stepper output{min-width:44px;text-align:center}

/* interruttore iOS */
.ds-switch{position:relative;width:51px;height:31px;flex:none;padding:0;border:0;border-radius:999px;background:var(--fill);cursor:pointer;transition:background .2s}
.ds-switch::before{content:"";position:absolute;inset:-8px -4px}
.ds-switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.ds-switch[aria-checked="true"]{background:var(--c-ready)}
.ds-switch[aria-checked="true"]::after{transform:translateX(20px)}

/* dashboard */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)}
.ds-tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0;padding:var(--space-3) var(--space-4);background:var(--surface);border:0;border-radius:22px;color:var(--ink);text-align:left;cursor:pointer;box-shadow:inset 0 0 0 .5px var(--sep)}
.ds-tile[aria-checked="true"]{box-shadow:inset 0 0 0 2px var(--tint)}
.ds-tile__label,.ds-tile__sub{color:var(--ink-muted)}
.ds-tile__label{font-weight:600}
.ds-chart{display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-4);background:var(--surface);border-radius:22px}
.ds-chart__head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-3)}
.ds-chart__body{display:flex;gap:var(--space-2);margin-top:var(--space-3)}
.ds-chart__axis{position:relative;flex:none;width:40px;height:160px;color:var(--ink-muted)}
.ds-chart__axis span{position:absolute;right:0;transform:translateY(-50%);white-space:nowrap}
.ds-chart__main{flex:1;min-width:0}
.ds-chart__plot{position:relative;height:160px;border-bottom:.5px solid var(--ink-muted);touch-action:pan-y;cursor:pointer;-webkit-user-select:none;user-select:none}
.ds-chart__grid{position:absolute;left:0;right:0;height:0;border-top:.5px dashed var(--sep);pointer-events:none}
.ds-chart__goal{position:absolute;left:0;right:0;height:0;border-top:1.5px dashed var(--ink-muted);pointer-events:none;z-index:1}
.ds-chart__goal span{position:absolute;right:0;bottom:2px;padding:0 var(--space-1);background:var(--surface);color:var(--ink-muted)}
.ds-chart__bars{position:absolute;inset:0;display:flex;align-items:flex-end;gap:2px}
.ds-chart--tot .ds-chart__bars{gap:var(--space-3)}
.ds-chart__bar{flex:1;min-width:0;height:0;background:var(--data);border-radius:3px 3px 0 0;opacity:.72}
.ds-chart--tot .ds-chart__bar{border-radius:7px 7px 0 0}
.ds-chart__bar.is-sel{opacity:1}
.ds-chart__x{position:relative;height:20px;margin-top:var(--space-1);color:var(--ink-muted)}
.ds-chart__x span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}

/* fogli (vetro) */
.overlay{position:absolute;inset:0;z-index:6}
.ds-scrim{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.ds-sheet{width:calc(100% - 16px);margin:0 8px 8px;padding:var(--space-3) var(--space-5) var(--space-5);background:linear-gradient(180deg,var(--glass-strong-a),var(--glass-strong-b));-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);border-radius:38px;color:var(--ink);max-height:92%;overflow:auto}
.ds-sheet__grab{width:36px;height:5px;margin:0 auto var(--space-4);border-radius:999px;background:var(--fill)}
.ds-sheet__title{margin:0 0 var(--space-2)}
.ds-sheet__title:focus{outline:none}
.ds-sheet__body{margin:0 0 var(--space-5);color:var(--ink-muted)}
.ds-sheet__actions{display:flex;flex-direction:column;gap:var(--space-3)}
.ds-sheet__list{display:flex;flex-direction:column;gap:var(--space-3);margin-bottom:var(--space-4)}
.ds-sheet .ds-button--secondary{background:var(--fill);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.addpage{position:absolute;left:0;right:0;bottom:0;top:calc(var(--status) + 6px);background:var(--bg);overflow:auto;z-index:6;display:flex;flex-direction:column;gap:var(--space-4);padding:var(--space-4) 20px var(--space-6);border-radius:38px 38px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.addpage > *{flex:none}
.addpage__head{display:flex;align-items:center;justify-content:center}
.addpage__head h2:focus{outline:none}

/* notifica e avviso (vetro) */
.banner-slot{position:absolute;left:10px;right:10px;top:calc(var(--status) + 6px);z-index:9;pointer-events:none}
.ds-notif{display:grid;grid-template-columns:auto 1fr auto;gap:var(--space-3);align-items:start;padding:var(--space-3) var(--space-4);border-radius:28px;color:var(--ink);pointer-events:auto;cursor:pointer;animation:drop .3s cubic-bezier(.2,.9,.3,1.1);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%)}
.ds-notif__icon{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:linear-gradient(180deg,#5fe27f,#2fb454);color:#0a2a12}
.ds-notif__body{color:var(--ink-muted)}
@keyframes drop{from{transform:translateY(-24px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.toast{position:absolute;left:50%;bottom:calc(var(--tabspace) + 8px);transform:translateX(-50%);z-index:9;padding:var(--space-3) var(--space-5);border-radius:999px;color:var(--ink);white-space:nowrap;pointer-events:none}

/* stati vuoti */
.ds-empty{display:flex;flex-direction:column;align-items:center;gap:var(--space-4);max-width:320px;margin:0 auto;padding:var(--space-7) var(--space-5);text-align:center}

@media (prefers-reduced-motion: reduce){
  .ds-button,.ds-switch,.ds-switch::after,.ds-notif,.oggi__count--pack{transition:none;animation:none}
  .ds-button:active,.ds-stepper button:active{transform:none}
}
@media (max-width:480px), (pointer:coarse){
  :root{--status:0px;--tab-bottom:12px;--tabspace:92px}
  .stage{padding:0;gap:0;display:block}
  .fit{width:100%;height:100%}
  .device{width:100%;height:100%;border:0;border-radius:0;background:transparent;transform:none;box-shadow:none}
  .island,.status,.home-ind,.panel{display:none}
  .screen{border-radius:0}
  .addpage{top:12px}
}
@media (min-width:481px) and (max-width:899px){.panel{display:none}}
/* vetro opaco con «Aumenta contrasto» (Safari non espone «Riduci trasparenza»): stessa forma, nessuna trasparenza */
@media (prefers-contrast: more){
  :is(.ds-button--secondary,.ds-button--danger,.ds-tabbar,.ds-stepper button,.toast,.ds-notif,.ds-sheet,.ds-pouch),#screen[data-scene="1"] .ds-tabbar{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:inset 0 0 0 1px var(--ink-muted)}
  .ds-sheet .ds-button--secondary{background:var(--fill);box-shadow:none}
}

/* ---------- app installata ---------- */
.panel{display:none!important}
html,body{overscroll-behavior:none}
@media (max-width:480px), (pointer:coarse){
  :root{--status:env(safe-area-inset-top,0px);--tab-bottom:max(12px,calc(env(safe-area-inset-bottom,0px) - 6px));--tabspace:calc(84px + var(--tab-bottom))}
  body{background:var(--bg)}
  .status{display:flex;height:var(--status);padding:0}
  .status > *{display:none}
  .addpage{top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:calc(var(--space-6) + env(safe-area-inset-bottom,0px))}
  .ds-sheet{margin-bottom:max(8px,env(safe-area-inset-bottom,0px))}
  .banner-slot{top:calc(env(safe-area-inset-top,0px) + 6px)}
}
/* iPhone installata: l'altezza al 100% esclude la barra di stato, quindi la scena si aggancia ai bordi reali dello schermo */
@media (max-width:480px), (pointer:coarse){
  html,body{height:var(--app-h,100%);overflow:hidden}
  .stage{position:absolute;top:0;left:0;right:0;height:var(--app-h,100%)}
  #screen[data-scene="1"] .status::before{background:linear-gradient(var(--s-bg),transparent)}
  .status::before{inset:0;-webkit-backdrop-filter:none;backdrop-filter:none;background:linear-gradient(var(--bg) 60%,transparent);-webkit-mask-image:none;mask-image:none}
}
/* niente zoom con il doppio tocco: si comporta come un'app */
html,body,*{touch-action:manipulation}
.swipe__row{touch-action:pan-y}
.ds-sheet__grab,.ds-sheet__title,.addpage__head{touch-action:none}

</style>
</head>
<body>
<div class="stage">
  <div class="fit">
    <div class="device">
      <div class="island"></div>
      <div class="screen" id="screen" data-tab="oggi" data-phase="ready">
        <div class="scene" id="scene" aria-hidden="true"></div>
        <div class="status text-body-strong" aria-hidden="true">
          <span id="clock">20:43</span>
          <span class="status__icons">
            <svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
            <svg viewBox="0 0 17 12"><path d="M8.5 2.3c2.3 0 4.4.9 6 2.4l1.1-1.2A10.3 10.3 0 0 0 8.5.6 10.3 10.3 0 0 0 1.4 3.5l1.1 1.2a8.6 8.6 0 0 1 6-2.4zm0 3.4c1.4 0 2.6.5 3.6 1.4l1.1-1.2a7.1 7.1 0 0 0-9.4 0l1.1 1.2c1-.9 2.2-1.4 3.6-1.4zm0 3.3c.7 0 1.3.3 1.8.7L8.5 11.7 6.7 9.700c.5-.4 1.100-.7 1.800-.7z"/></svg>
            <svg viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor"/><rect x="2" y="2" width="17" height="9" rx="2"/><rect x="25" y="4.5" width="2" height="4" rx="1"/></svg>
          </span>
        </div>
        <main class="view" id="view"></main>
        <div class="tabfade" aria-hidden="true"></div>
        <nav class="ds-tabbar" id="tabs" aria-label="Sezioni"></nav>
        <div class="overlay" id="overlay" hidden></div>
        <div class="banner-slot" id="banner" aria-live="polite"></div>
        <div class="toast text-body-strong" id="toast" role="status" hidden></div>
      </div>
      <div class="home-ind"></div>
    </div>
  </div>
</div>

<script src="config.js?v=1.0.3"></script>
<script src="app.js?v=1.0.3"></script>
</body>
</html>
